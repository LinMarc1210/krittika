[GENERAL]
run name = ironwood_bf16

[COMPUTE]
num compute cores = 4
matmul core present = True
vector core present = True
matmul arrrow = 256
matmul arrcol = 256
matmul default dataflow = ws
vector dim = 256
vector default dataflow = ws
simd length = 4
partition strategy = USER

[MEMORY]
ifmap offset = 0
filter offset = 10000000
ofmap offset = 20000000
per core ifmap sram size kb = 4096
per core filter sram size kb = 4096
per core ofmap sram size kb = 8192

[INTERFACE]
bandwidth mode = USER
per core user ifmap buf interface bw (words/cycle) = 217
per core user filter buf interface bw (words/cycle) = 435
per core user ofmap buf interface bw (words/cycle) = 217
