[GENERAL]
run name = ironwood_fp8

[COMPUTE]
num compute cores = 4
matmul core present = True
vector core present = True
matmul arrrow = 512
matmul arrcol = 512
matmul default dataflow = ws
vector dim = 512
vector default dataflow = ws
simd length = 4
partition strategy = USER

[MEMORY]
ifmap offset = 0
filter offset = 10000000
ofmap offset = 20000000
per core ifmap sram size kb = 8192
per core filter sram size kb = 8192
per core ofmap sram size kb = 16384

[INTERFACE]
bandwidth mode = USER
per core user ifmap buf interface bw (words/cycle) = 434
per core user filter buf interface bw (words/cycle) = 870
per core user ofmap buf interface bw (words/cycle) = 434
