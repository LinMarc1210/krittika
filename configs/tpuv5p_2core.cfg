[GENERAL]
run name = tpuv5p

[COMPUTE]
num compute cores = 2
matmul core present = True
vector core present = True
matmul arrrow = 128
matmul arrcol = 128
matmul default dataflow = ws
vector dim = 128
vector default dataflow = ws
simd length = 4
partition strategy = USER

[MEMORY]
ifmap offset = 0
filter offset = 10000000
ofmap offset = 20000000
per core ifmap sram size kb = 2048
per core filter sram size kb = 2048
per core ofmap sram size kb = 4096

[INTERFACE]
bandwidth mode = USER
per core user ifmap buf interface bw (words/cycle) = 41
per core user filter buf interface bw (words/cycle) = 82
per core user ofmap buf interface bw (words/cycle) = 41
